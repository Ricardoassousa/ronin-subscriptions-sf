payments_history:
    path: /history
    controller: App\Controller\PaymentController::history
    methods: [GET]

payment_checkout:
    path: /checkout/{paymentId}
    controller: App\Controller\PaymentController::checkout
    methods: [GET, POST]

payment_success:
    path: /success/{paymentId}
    controller: App\Controller\PaymentController::success
    methods: [GET]